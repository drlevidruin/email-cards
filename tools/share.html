<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Email Cards share image</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0A5A44; color: #F6F4EE; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .voice { font-family: ui-serif, Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif; font-weight: 700; letter-spacing: -0.012em; font-variant-numeric: lining-nums; }
  .page { position: relative; width: 1200px; height: 630px; }
  .left { position: absolute; left: 84px; top: 0; bottom: 0; width: 650px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 34px; line-height: 40px; font-weight: 600; }
  .brand img { display: block; width: 64px; height: 64px; border-radius: 15px; }
  h1 { margin-top: 44px; font-size: 60px; line-height: 68px; white-space: nowrap; }
  .art { position: absolute; left: 800px; top: 175px; width: 280px; height: 280px; }
  .card { width: 280px; height: 252px; margin-top: 14px; padding: 28px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; color: #191714; }
  .sender { display: flex; align-items: center; gap: 14px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; background: #E4E2DC; }
  .name { width: 110px; height: 13px; border-radius: 7px; background: #E4E2DC; }
  .ask { font-size: 29px; line-height: 35px; }
  .rule { height: 2px; background: rgba(28,25,20,0.14); }
  .lines { display: flex; flex-direction: column; gap: 10px; }
  .lines span { display: block; height: 12px; border-radius: 6px; background: #E4E2DC; position: relative; }
  .lines span:nth-child(1) { width: 100%; }
  .lines span:nth-child(2) { width: 92%; }
  .lines span:nth-child(3) { width: 56%; }
  .lines span:nth-child(2)::before { content: ''; position: absolute; left: -5px; top: -5px; width: calc(60% + 5px); height: 22px; border-radius: 5px; background: linear-gradient(rgba(11,122,90,0.16), rgba(11,122,90,0.16)), #FFFFFF; }
  .lab { position: absolute; display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 26px; line-height: 32px; font-weight: 600; color: rgba(246,244,238,0.74); }
  .lab svg { width: 26px; height: 26px; flex: none; }
  .r { left: 292px; top: 124px; }
  .l { right: 292px; top: 124px; }
  .u { left: 50%; top: -52px; translate: -50% 0; flex-direction: column; gap: 2px; }
  .d { left: 50%; top: 292px; translate: -50% 0; flex-direction: column; gap: 2px; }
</style>
</head>
<body>
<div class="page">
  <div class="left">
    <div class="brand"><img src="icon-192.png" alt="">Email Cards</div>
    <h1 class="voice">Clear your inbox,<br>one email at a time.</h1>
  </div>
  <div class="art">
    <div class="card">
      <div class="sender"><span class="dot"></span><span class="name"></span></div>
      <p class="voice ask">What it needs<br>from you</p>
      <div class="rule"></div>
      <div class="lines"><span></span><span></span><span></span></div>
    </div>
    <span class="lab r">Done <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
    <span class="lab l"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Later</span>
    <span class="lab u"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>To-do</span>
    <span class="lab d">Skip<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></span>
  </div>
</div>
</body>
</html>
